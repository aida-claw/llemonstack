# EXAMPLE CONFIG
# This file is copied into the litellm container at runtime to /app/config.yaml
#
# Preconfigure this config with models or other settings to avoid the need to
# configure the proxy via the UI.
#
# See:
# - https://docs.litellm.ai/docs/proxy/configs
# - https://docs.litellm.ai/docs/proxy/config_settings
# - https://docs.litellm.ai/docs/proxy/config_management
# - https://github.com/BerriAI/litellm/blob/main/proxy_server_config.yaml

# Import local LLM models, auto generated by start script
# include:
#   - config.localmodels.yaml

litellm_settings:
  # LOGGING SETTINGS
  # Log raw request and response to logging provider
  # See:
  # - https://docs.litellm.ai/docs/observability/raw_request_response
  # - https://docs.litellm.ai/docs/proxy/debugging
  log_raw_request_response: True
  # json_logs: True
  # set_verbose: True # Defaults to true if LITELLM_LOG=DEBUG

  # Drop unsupported params from request; set to False in production
  # Global setting, can be overridden in model_list per model
  # See https://docs.litellm.ai/docs/completion/drop_params
  drop_params: True

  # BUDGET SETTINGS
  max_budget: 100
  budget_duration: 30d
  num_retries: 5
  fallbacks: [{"aida/frontier-think": ["aida/think"]}]
  request_timeout: 600
  telemetry: False

  # CACHE SETTINGS
  # See https://docs.litellm.ai/docs/proxy/caching
  cache: true # Enable cache if redis is enabled
  cache_params:
    type: redis
    namespace: "litellm.caching.caching"
    ttl: 3600 # cached on redis for 3600 seconds (1 hour)

    # Aida-claw NOTE: 
    #     Variable interpolation does not work here:
    # host: "redis"  # The host address for the redis cache
    # port: 6379  # The port number for the redis cache
    # username: "default"
    # password: os.environ/REDIS_PASSWORD # The password for the redis cache

  # Default observability settings
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  langfuse_public_key: os.environ/LANGFUSE_PUBLIC_KEY
  langfuse_secret: os.environ/LANGFUSE_SECRET_KEY
  langfuse_host: os.environ/LANGFUSE_HOST

  # Team settings
  # default_team_settings:
  #   - team_id: local-team
  #   - team_id: team-2
  #     success_callback: ["langfuse"]
  #     failure_callback: ["langfuse"]
  #     langfuse_public_key: os.environ/LANGFUSE_PROJECT2_PUBLIC # Project 2
  #     langfuse_secret: os.environ/LANGFUSE_PROJECT2_SECRET # Project 2
  #     langfuse_host: https://us.cloud.langfuse.com

  # context_window_fallbacks: [{"gpt-3.5-turbo": ["gpt-3.5-turbo-large"]}]

general_settings:
  # Enforce auth on proxy
  # See https://docs.litellm.ai/docs/proxy/virtual_keys
  master_key: os.environ/LITELLM_MASTER_KEY

  store_model_in_db: True
  # Adds prompts to the spend logs
  store_prompts_in_spend_logs: True

  proxy_budget_rescheduler_min_time: 60
  proxy_budget_rescheduler_max_time: 64
  proxy_batch_write_at: 1

  database_connection_pool_limit: 10
  database_url: os.environ/DATABASE_URL

  # Disable default team, when true user cannot create personal keys
  # default_team_disabled: true
model_list:
  # LM Studio — Primary thinking backend (~45 tok/s on M4 Pro 64GB)
  - model_name: "aida/think"
    litellm_params:
      model: "openai/qwen-var/qwen3.6-35b-a3b-q8-mlx-think"
      api_base: http://host.docker.internal:1234/v1
      api_key: sk-lm-studio
      supports_function_calling: true
      input_cost_per_token: 0
      output_cost_per_token: 0
      extra_body:
        ttl: 1800

  # LM Studio — Primary coding backend (~?? tok/s on M4 Pro 64GB)
  - model_name: "aida/code"
    litellm_params:
      model: "openai/qwen-var/qwen3.6-35b-a3b-q8-mlx-nothink"
      api_base: http://host.docker.internal:1234/v1
      api_key: sk-lm-studio
      supports_function_calling: true
      stream: false
      input_cost_per_token: 0
      output_cost_per_token: 0
      extra_body:
        ttl: 1800

  # LM Studio — Embedding model for RAG pipelines (Qdrant)
  - model_name: "lmstudio/qwen3-embedding-8b"
    litellm_params:
      model: "openai/text-embedding-qwen3-embedding-8b"
      api_base: http://host.docker.internal:1234/v1
      api_key: sk-lm-studio
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      mode: embedding

  # OpenAI — Frontier thinking backend (GPT-5, Aug 2025)
  # No API training. US jurisdiction. $0.63/$5.00 per 1M (standard rate).
  # Cost tracking set at long-context rate ($1.25/$10.00) as conservative estimate.
  # Context window: 400K tokens. Max output: 32K tokens.
  - model_name: "aida/frontier-think"
    litellm_params:
      model: "openai/gpt-5"
      api_key: os.environ/OPENAI_API_KEY
      stream: true
      max_tokens: 32768
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.00001
    model_info:
      supports_function_calling: true

