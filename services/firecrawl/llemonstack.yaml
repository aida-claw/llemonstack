version: 0.2.0 # Config file version

service: firecrawl
name: Firecrawl
description: Scrape, crawl and extract websites into LLM-friendly structured data.

compose_file: docker-compose.yaml
service_group: middleware

# Prebuilt, digest-pinned images (see docker-compose.yaml). No source build:
# the `repo:` block is intentionally removed — nothing is cloned into .llemonstack/repos.

provides:
  firecrawl: firecrawl-api                        # main API container (harness)
  firecrawl-playwright: firecrawl-playwright-service

# No stack-service dependencies: Firecrawl runs its own isolated
# redis / rabbitmq / nuq-postgres (state-isolated, network-integrated).
# (Former `depends_on: redis` removed — that referenced the shared stack redis.)

exposes:
  internal:
    firecrawl-api:
      name: Firecrawl API
      url: http://firecrawl-api:3002/        # in-network alias; Hermes web.extract_backend target
    playwright:
      name: Playwright Service
      url: http://firecrawl-playwright-service:3000/scrape
  # No host exposes: the api host port mapping was dropped for containment.
  # (Former host dashboard at localhost:3002 requires a published port; omitted by design.)

init:
  generate:
    FIRECRAWL_BULL_KEY:
      method: generateSecretKey
      length: 20
      