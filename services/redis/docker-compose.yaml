# Redis
#
# Redis is used by various services as a caching layer.
# By default, data is ephemeral and not saved to disk.
#
# https://github.com/redis/redis

networks:
  default:
    name: ${LLEMONSTACK_NETWORK_NAME}
    external: true

volumes:
  redis_data:
    driver: local

services:
  redis:
    container_name: redis
    labels:
      dev.dozzle.group: Data Stores
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    restart: always
    command: >
      --requirepass ${REDIS_PASSWORD} --loglevel notice
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    volumes:
      - redis_data:/data
